    # P33 PASSIVE probe. Unlike every other probe in this catalog this one is not delivered
    # through the sign editor at all.
    #
    # Proven chain (from the real mod jar and the real Paper 1.21.11 server jar):
    #   Jade registers ClientPlayConnectionEvents.JOIN and, in that handler, unconditionally
    #   constructs ClientHandshakePacket and calls ClientPlayNetworking.send(...)  [Jade jar]
    #   -> C2S custom payload on channel "jade:client_handshake"
    #   -> the server has no codec for that channel, so it decodes as DiscardedPayload,
    #      preserving the channel id and the raw bytes
    #   -> ServerCommonPacketListenerImpl.handleCustomPayload calls
    #      CraftServer.getMessenger().dispatchIncomingMessage(conn, "jade:client_handshake", data)
    #   -> StandardMessenger dispatches to listeners registered for that exact channel
    #   -> this probe
    #
    # Consequences: the client sends it on join with no user interaction, so observing it
    # opens no UI, captures no input, and cannot interrupt movement. Absence of the channel
    # proves nothing and stays CLEAN, so this can never produce a false positive.
    #
    # ENFORCEMENT: a confirmed passive detection does NOT reach enforcement unless
    # client-detection.passive.enforce is set to true. Jade is a legitimate utility mod, so
    # kicking players for it by default would be a false positive.
    jade-network-handshake:
      display-name: "Jade (network handshake)"
      key: "jade:client_handshake"
      mode: TRANSLATE
      enabled: true
      manual: true
      automatic: true
      verification: UNVERIFIED
      category: utility
      source: "Jade 21.1.6 Fabric jar (ClientProxy.onInitializeClient -> ClientPlayConnectionEvents.JOIN -> ClientPlayNetworking.send) + Paper 1.21.11 ServerCommonPacketListenerImpl.handleCustomPayload -> Messenger.dispatchIncomingMessage"
      notes: "UNVERIFIED: proven from the mod bytecode and the server bytecode, not from a live client session. Automatic and passive: the client emits this channel on join with no user interaction. Do not promote to VERIFIED without a live run."
      transport: PASSIVE
      passive-channel: "jade:client_handshake"

