# Client/mod identity probes.
#
# HOW DETECTION ACTUALLY WORKS, AND WHAT IT CANNOT DO
#
# Every probe in this catalog is delivered the same way: the server writes a translatable
# component onto a temporary sign, opens that sign's editor on the client, and reads the
# sign text the client submits back. The client can only answer by opening a screen and
# pressing done. That is an INTERACTIVE transport.
#
# Consequences you must know before enabling anything here:
#
#   * There is no non-interactive, server-observable per-mod identity signal available on
#     Paper 1.21.11 for Fabric or vanilla clients. Reading one would need a client-side mod
#     or a packet-level library, which this plugin deliberately does not use. The sign
#     round-trip is therefore the only mechanism, and it is interactive by nature.
#   * Because an interactive probe captures the player's client UI and interrupts normal
#     movement, auto-check.interactive defaults to false and no INTERACTIVE probe runs
#     automatically. An automatic join scan opens no client UI at all.
#   * Only a translation key that the target mod itself defines is authoritative. A probe
#     can report DETECTED only if it declares identity-resolution: true (or an exact
#     expected-response). Without that declaration, ambiguous localized text is reported
#     UNCERTAIN and is never promoted, because this protocol carries plain strings and
#     cannot attribute an unknown translation to a specific mod.
#   * Client brand, Fabric brand, timing, and silence are never evidence of cheating.
#
# UNVERIFIED means the exact probe has not been validated against a live client. It stays
# enabled or manual-only and is honestly labelled; it is not a claim of coverage.
client-detection:
  enabled: true
  double-check: true
  # 40 ticks is the conservative response deadline.
  timeout-ticks: 40
  # Consecutive-silence backoff: after this many back-to-back batches in one pass
  # each time out on the full deadline, later batches use short-timeout-ticks.
  # Every probe still gets its own sign editor interaction and a shortened wait
  # is still recorded as TIMEOUT (never CLEAN), so result semantics are unchanged;
  # only silent-client wall time shrinks. Any response resets the streak, and
  # double-check confirmation passes always start with the full deadline, so
  # responsive clients (which answer each editor promptly) never reach the short
  # deadline. Silent/non-responsive clients still take several seconds for a large
  # probe set because the protocol intentionally avoids overlapping sign editors.
  # short-timeout-ticks equal to or above timeout-ticks disables the backoff.
  short-timeout-ticks: 10
  short-timeout-after-consecutive-timeouts: 2
  # A response completes the prior batch; the next batch can start without an extra tick.
  between-probe-ticks: 0
  # Passive observation (P33). Uses only the supported Paper plugin-messaging API: Paper
  # dispatches every inbound custom payload to the Bukkit Messenger, and a listener
  # registered for a declared channel receives it. No NMS, no Netty, no dependency, and
  # nothing is ever sent to the client, so this cannot prompt the client to do anything.
  #
  # passive.enforce defaults to false. Passive identity evidence is authoritative about
  # which mod is present, but the one channel proven so far belongs to a legitimate
  # utility mod, so a confirmed passive detection is reported and never kicks by default.
  passive:
    enforce: false

  auto-check:
    on-join: true
    delay-ticks: 20
    first-join-only: false
    max-concurrent: 32
    # Every probe in this catalog uses the sign round-trip, so every probe declares
    # transport: INTERACTIVE: the server must open a sign editor and the client must
    # submit it before any response can be observed.
    #
    # That captures the player's client UI and interrupts normal movement, so it is
    # NOT safe to run unattended on join. With this false (the default) no INTERACTIVE
    # probe may run automatically and an automatic join scan opens no client UI at all.
    # Run the interactive probes explicitly with /vac check <player>, where the operator
    # accepts the UI cost for that player.
    #
    # Set this to true only if you accept that every automatic check will repeatedly
    # open a sign editor on the player's screen and block their movement while it waits.
    interactive: false
  probes:
    # Client / hacked-client families
    meteor-client:
      display-name: "Meteor Client"
      key: "key.meteor-client.open-gui"
      mode: METEOR
      expected-response: "Open GUI"
      enabled: true
      manual: true
      automatic: true
      verification: VERIFIED
      category: client
      transport: INTERACTIVE
      identity-resolution: true
      source: "Meteor Client 1.21.11-86 live validation"
      notes: "Verified on Minecraft 1.21.11 / Meteor Client 1.21.11-86: 3 automatic + 1 manual DETECTED (STRONG, double-check confirmed, KICK enforced exactly once per session), 6 clean baselines (3 vanilla + 3 clean Fabric, 28 CLEAN each), 0 cross-probe collisions."
      # P32: the recorded en_us string only covers the default locale. Because this key is
      # defined by Meteor itself, any non-fallback resolution of it is authoritative and
      # locale-independent. A client that cannot resolve it still echoes the sentinel.
    # ---------------------------------------------------------------------
    # P33: operator-requested clients with NO artifact available to verify.
    #
    # These three are recorded so they are visible in /vac probes and ready to enable, but
    # they ship DISABLED because no client jar was available to confirm a real translation
    # key or a real server-bound channel. The key field below is an explicit placeholder,
    # not a claimed identifier, following the P29 itemscroller precedent.
    #
    # Do NOT enable them as-is: a placeholder key resolves to nothing on a real client, so
    # the probe would silently report CLEAN forever and give false assurance. To promote
    # one, extract the identifier from the client build and replace the key, then record
    # where it was read in `source`.
    # ---------------------------------------------------------------------
