# CheckHacks 1.3.1-derived probe definitions.
# All entries are migrated/configured and currently marked UNVERIFIED.
client-detection:
  enabled: true
  double-check: true
  # 40 ticks is a 2 second failure deadline; live 1.21.11 responses arrive sooner.
  timeout-ticks: 40
  # One tick preserves client/server ordering without adding visible idle time.
  between-probe-ticks: 1
  auto-check:
    on-join: true
    # Give the client time to finish joining before opening the probe sign.
    delay-ticks: 20
    first-join-only: false
    max-concurrent: 32
    probes:
      - meteor-client
      - liquidbounce
      - freecam
      - wurst
      - xray-fabric
      - chestesp
      - killaura-fabric
      - autofish
      - lumina
      - autoswitch
      - bleachhack
      - aristois
      - coffee
      - world-downloader
      - autoclicker-fabric
      - antiafk
      - auto-clicker-mc
      - trouser-streak
      - ui-utils
      - seeedcrackerx
      - simple-world-downloader
      - trouser-streak-newchunks
      - trouser-streak-anhero
      - glazed
      - litematica
      - itemscroller
       - baritone
       - xaeros-worldmap
  probes:
    meteor-client:
      display-name: "Meteor Client"
      key: "key.meteor-client.open-gui"
      mode: METEOR
      enabled: true
      verification: UNVERIFIED
    liquidbounce:
      display-name: "LiquidBounce"
      key: "liquidbounce.module.killaura.name"
      mode: TRANSLATE
      enabled: true
      verification: UNVERIFIED
    freecam:
      display-name: "Freecam"
      key: "key.freecam.toggle"
      mode: KEYBIND
      enabled: true
      verification: UNVERIFIED
    wurst:
      display-name: "Wurst Client (-1.21)"
      key: "key.wurst.zoom"
      mode: KEYBIND
      enabled: true
      verification: UNVERIFIED
    xray-fabric:
      display-name: "XRay (Fabric)"
      key: "xray.config.toggle"
      mode: KEYBIND
      enabled: true
      verification: UNVERIFIED
    chestesp:
      display-name: "ChestESP"
      key: "key.chestesp.toggle"
      mode: KEYBIND
      enabled: true
      verification: UNVERIFIED
    killaura-fabric:
      display-name: "KillAura (Fabric)"
      key: "key.killaura"
      mode: KEYBIND
      enabled: true
      verification: UNVERIFIED
    autofish:
      display-name: "AutoFish"
      key: "key.autofish.open_gui"
      mode: KEYBIND
      enabled: true
      verification: UNVERIFIED
    lumina:
      display-name: "Lumina"
      key: "key.lumina.open_click_gui"
      mode: KEYBIND
      enabled: true
      verification: UNVERIFIED
    autoswitch:
