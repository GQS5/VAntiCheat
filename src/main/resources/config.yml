# Minimal VAntiCheat foundation configuration.
vanticheat:
  enabled: true
  debug: false
detection:
  enabled: true
enforcement:
  enabled: true
  confirmed-detection:
    message: "Cheating detected."
# Lunar Client is allowed. When the official Apollo plugin is installed,
# lunar.minimap.enabled=true disables the Lunar Minimap via Apollo override.
# Players are never kicked or classified as cheats by this policy.
lunar:
  enabled: true
  minimap:
    enabled: true
    action: DISABLE
