# ============================================================
# VAntiCheat messages — admin CMS (reloaded by /vac reload)
# Placeholders: %player% %uuid% %ping% %check% %confidence% %vl%
#   %action% %client% %mod% %profile% %platform% %server_version%
#   Both %name% and {name} work. Values are always plain text.
# Colors: &0-9 &a-f for color, &l bold, &o italic, &n underline, &r reset.
# Titles kept ASCII-only for console compatibility.
# ============================================================

prefix: "[VAC] "

general:
  no-permission: "&c[VAC] &fNo permission."
  no-permission-detail: "&c[VAC] &fNo permission (&7{perm}&f)."
  player-not-found: "&c[VAC] &fPlayer not found."
  unknown-subcommand: "&c[VAC] &fUnknown subcommand. &7Use &e/vac &7for help."

commands:
  usage-header: "&6-- VAntiCheat Help --"
  usage-general: "&eGeneral: &f/vac status &7| &f/vac reload &7| &f/vac diagnostics"
  usage-security: "&eSecurity: &f/vac test <player> &7| &f/vac trust <player> &7| &f/vac untrust <player>"
  usage-inspection: "&eInspection: &f/vac inspect <player> &7| &f/vac evidence <player> &7| &f/vac alerts"
  usage-debug: "&eDebug: &f/vac debug performance &7| &f/vac debug player <p> &7| &f/vac debug client <p>"
  usage-admin: "&eAdministration: &f/vac punish &7(info) &7| &f/vac reload"
  usage-perm-hint: "&7Requires permission: &f{vanti_perm}"
  reloaded: "&a[VAC] &fReloaded safely (evidence + trust preserved)."
  trusted: "&a[VAC] &fTrusted &e{player}&f."
  untrusted: "&e[VAC] &fUntrusted &e{player}&f."
  punish-hint: "&e[VAC] &fPunishments are evidence-driven; use &e/vac inspect &fand &e/vac evidence &ffirst. Manual bans via vanilla &e/ban&f."
  alerts-hint: "&e[VAC] &fAlerts go to players with permission &e{perm}&f."
  no-evidence: "&7[VAC] No evidence for &f{player}&7."

status:
  title: "&6-- VAntiCheat Status --"
  line-enabled: "&7Status: &aENABLED"
  line-disabled: "&7Status: &cDISABLED"
  profile: "&7Profile: &e{profile}"
  footer-hint: "&7Use &e/vac diagnostics &7for details."

inspect:
  title: "&6-- Inspection: &e{player} &6--"
  verdict-normal: "&aNORMAL"
  verdict-suspicious: "&eSUSPICIOUS"
  verdict-high: "&6HIGH"
  verdict-very-high: "&cVERY HIGH"
  verdict-confirmed: "&4&lCONFIRMED"
  confidence: "&7Confidence: &f{confidence}%"
  trust-yes: "&7Trusted: &ayes"
  trust-no: "&7Trusted: &cno"
  client-title: "&6Client:"
  client-brand: "&7  Brand: &f{brand}"
  client-channels: "&7  Channels: &f{channels}"
  client-matched: "&7  Flags: &f{flags}"
  detection-title: "&6Detection:"
  state-normal: "&aNormal"
  state-suspicious: "&eSuspicious"
  state-high: "&cHigh"
  evidence-title: "&6Recent evidence:"
  evidence-row: "&7  [{severity}] &f{check}&7: {detail} &8({confidence}%)"
  evidence-none: "&7  None recorded."
  ores: "&7Mining: &f{total} ores &7(&f{hidden} hidden&7, &f{rare} rare&7)"

alerts:
  format-rest: "&8| &e{player} &8| &f{check} &8| &7{confidence}% &8| &f{action}"
  confirmed: "&4[VAC] CRITICAL &8| &e{player} &8| &f{mod} &8| &7{confidence}% &8| &c{action}"

diagnostics:
  title: "&6-- VAntiCheat Diagnostics --"
  server: "&7Server: &f{platform} {mc} &7(Java {java})"
  recommendation-viaversion: "&7Recommendation: install ViaVersion only if you need older clients; otherwise native is fastest."
  queues: "&7Evidence: &f{evidence} &7| Heap: &f{heap}"

client-security:
  forbidden-client: "&cForbidden client: &f{client}"
  forbidden-mod: "&cForbidden mod: &f{mod}"
  spoof-note: "&ePossible brand/channel mismatch for &f{player} &7({detail})"

punishment:
  warn-message: "&e[VAC] &fWarning: suspicious activity detected (&7{check}&f)."
  kick-forbidden-client: "Kicked by VAntiCheat\nForbidden client detected.\nAppeal: contact staff"
  kick-forbidden-mod: "Kicked by VAntiCheat\nForbidden mod detected ({mod}).\nAppeal: contact staff"
  kick-cheat: "Kicked by VAntiCheat\n{reason}\nConfidence: {confidence}%\nAppeal: contact staff"
  dry-run-note: "[VAC] [DRY-RUN] would have applied {action} to {player} ({reason})."

errors:
  diagnostics-unavailable: "&c[VAC] &fDiagnostics unavailable."
  internal: "&c[VAC] &fSomething went wrong. Check console for details."
